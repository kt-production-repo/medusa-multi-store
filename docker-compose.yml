# ===========================================================================
# OPTIONAL — all five services in one Dokploy "Docker Compose" service.
#
# The recommended setup is 5 SEPARATE Dokploy services (see README.md), which
# gives you independent deploys, per-service logs/monitoring, native database
# backups and independent scaling.
#
# Use this file instead if you prefer a single deployable unit, or to run the
# whole stack locally with `docker compose up --build`.
#
# In Dokploy: create a "Docker Compose" service, set Compose Path to
# docker-compose.yml, then add domains via the Domains tab (Dokploy injects
# the Traefik labels automatically — do not hand-write them here).
# ===========================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medusa}
    volumes:
      # Named volume, not a bind mount: survives redeploys and is
      # backup-able via Dokploy's Volume Backups.
      - medusa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medusa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - medusa_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.53.0
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:?set MEILISEARCH_API_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - medusa_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "7700:7700"

  backend-server:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      args:
        DISABLE_MEDUSA_ADMIN: "false"
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:?set MEDUSA_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "9000"
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medusa}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:?set MEILISEARCH_API_KEY}
      MEILISEARCH_PRODUCT_INDEX_NAME: ${MEILISEARCH_PRODUCT_INDEX_NAME:-products}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-}
      MEDUSA_SEED: ${MEDUSA_SEED:-false}
    expose:
      - "9000"

  backend-worker:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
      args:
        DISABLE_MEDUSA_ADMIN: "true"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "9000"
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medusa}
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:?set MEILISEARCH_API_KEY}
      MEILISEARCH_PRODUCT_INDEX_NAME: ${MEILISEARCH_PRODUCT_INDEX_NAME:-products}
      WORKER_START_DELAY: "20"
    # No ports and no domain: workers must never be publicly reachable.

  storefront:
    build:
      context: .
      dockerfile: deploy/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?set NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:?set NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-gb}
    restart: unless-stopped
    depends_on:
      - backend-server
    environment:
      NODE_ENV: production
      PORT: "8000"
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
    expose:
      - "8000"

volumes:
  medusa_postgres_data:
  medusa_redis_data:
  medusa_meilisearch_data:
